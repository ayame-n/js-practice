<!DOCTYPE HTML>
 <html>
    <head>
        <meta charset="UTF-8">
        <title>Change background color</title>
        <style>
            body {
                background-color: lightblue;
            }
            .green {
                background-color: lightgreen;
            }
        </style>

    </head>
    <body>
        <div>
        <button onclick="changeBg()">Click me to change background color</button>
        </div>
        <script>
            function changeBg() {
                    document.body.classList.toggle("green");
            }
        </script>
    </body>
 </html>
