<!DOCTYPE html>
<html>
 <head>
    <meta charset="UTF-8">
    <title> Stopwatch </title>
    <link rel="stylesheet" href="stopwatch.css">
 </head>
 <body>
    <div class="stopwatch">
        <h1>ストップウォッチ</h1>
        <p>00:00:00:000</p>
        <div class="buttons">
            <button id="start">スタート</button>
            <button id="stop">ストップ</button>
            <button id="reset">リセット</button>
        </div>
    </div>
    <script src="stopwatch.js"></script>
 </body>
</html>
